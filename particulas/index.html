<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pintura de partículas</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b14;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  #ui{position:fixed;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap}
  button{background:#ffffff18;color:#fff;border:1px solid #ffffff30;border-radius:8px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(6px)}
  button:hover{background:#ffffff30}
  #hint{position:fixed;bottom:12px;left:12px;color:#ffffff90;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="pal">Paleta: Neón</button>
  <button id="mode">Modo: Fuente</button>
  <button id="clear">Limpiar</button>
  <button id="save">Guardar PNG</button>
</div>
<div id="hint">Mueve el ratón (o el dedo). Haz clic para una explosión.</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
function resize(){ c.width = innerWidth; c.height = innerHeight; ctx.fillStyle='#0b0b14'; ctx.fillRect(0,0,c.width,c.height); }
addEventListener('resize', resize); resize();

const palettes = {
  'Neón':   [300,180,60,140],
  'Fuego':  [0,15,30,45],
  'Océano': [180,200,220,250],
  'Arcoíris': [0,60,120,180,240,300]
};
const palNames = Object.keys(palettes); let palIdx = 0;
const modes = ['Fuente','Órbita','Espiral']; let modeIdx = 0;
let parts = [], mx = innerWidth/2, my = innerHeight/2, t = 0;

function spawn(x, y, n, burst){
  const hues = palettes[palNames[palIdx]];
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = burst ? 2+Math.random()*6 : 0.5+Math.random()*2;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,
      r:1+Math.random()*3, h:hues[Math.floor(Math.random()*hues.length)]+Math.random()*20});
  }
}
function move(x,y){ mx=x; my=y; spawn(x,y,4,false); }
c.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
c.addEventListener('touchmove', e=>{e.preventDefault(); const p=e.touches[0]; move(p.clientX,p.clientY);},{passive:false});
c.addEventListener('mousedown', e=>spawn(e.clientX,e.clientY,120,true));

function frame(){
  t += 0.03;
  ctx.fillStyle = 'rgba(11,11,20,0.12)'; ctx.fillRect(0,0,c.width,c.height);
  ctx.globalCompositeOperation = 'lighter';
  for(const p of parts){
    if(modeIdx===1){ const dx=mx-p.x, dy=my-p.y, d=Math.hypot(dx,dy)+1; p.vx += -dy/d*0.15 + dx/d*0.02; p.vy += dx/d*0.15 + dy/d*0.02; }
    else if(modeIdx===2){ const a=Math.atan2(p.vy,p.vx)+0.06; const s=Math.hypot(p.vx,p.vy); p.vx=Math.cos(a)*s; p.vy=Math.sin(a)*s; }
    else { p.vy += 0.03; }
    p.x += p.vx; p.y += p.vy; p.vx*=0.99; p.vy*=0.99; p.life -= 0.006;
    ctx.fillStyle = `hsla(${p.h},100%,60%,${Math.max(p.life,0)})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  parts = parts.filter(p=>p.life>0);
  if(parts.length>4000) parts.splice(0,parts.length-4000);
  requestAnimationFrame(frame);
}
frame();

pal.onclick = ()=>{ palIdx=(palIdx+1)%palNames.length; pal.textContent='Paleta: '+palNames[palIdx]; };
mode.onclick = ()=>{ modeIdx=(modeIdx+1)%modes.length; mode.textContent='Modo: '+modes[modeIdx]; };
clear.onclick = ()=>{ parts=[]; ctx.fillStyle='#0b0b14'; ctx.fillRect(0,0,c.width,c.height); };
save.onclick = ()=>{ const a=document.createElement('a'); a.download='particulas.png'; a.href=c.toDataURL(); a.click(); };
</script>
</body>
</html>
